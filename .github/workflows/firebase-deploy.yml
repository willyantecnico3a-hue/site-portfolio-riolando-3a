name: Deploy Firebase Hosting and Firestore rules

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Firebase deploy credential
        id: deploy_credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy ignorado. Cadastre o secret FIREBASE_SERVICE_ACCOUNT nas configurações do repositório GitHub."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.deploy_credential.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        if: steps.deploy_credential.outputs.available == 'true'
        run: npm install --global firebase-tools

      - name: Configure Firebase service account
        if: steps.deploy_credential.outputs.available == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules and Hosting
        if: steps.deploy_credential.outputs.available == 'true'
        run: firebase deploy --project horariosprofsriolandocanno --only firestore:rules,hosting --non-interactive
