<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f8fafc">
    <title>Horarios dos Professores | Celular</title>
    <link rel="stylesheet" href="horario-celular.css">
</head>
<body>
    <main class="painel-tv-horarios">
        <header class="topo-tv-horarios">
            <div>
                <h1>Riolando Conecta Tecnico</h1>
                <p>Horarios dos Professores</p>
            </div>

            <div class="relogio-tv">
                <span id="diaSemanaAtualTv">Carregando...</span>
                <strong id="horaAtualTv">--:--</strong>
            </div>
        </header>

        <section class="faixa-status-tv">
            <div>
                <span>Agora em aula</span>
                <strong id="totalAulasAgoraTv">0</strong>
            </div>

            <div>
                <span>Proximos horarios</span>
                <strong id="proximoHorarioResumoTv">--:--</strong>
            </div>
        </section>

        <section class="filtro-professor-celular">
            <h2>Minhas aulas</h2>

            <label for="filtroProfessorNomeTv">Nome do professor</label>
            <input type="text" id="filtroProfessorNomeTv" placeholder="Digite seu nome">

            <label for="filtroProfessorDiaTv">Dia da semana</label>
            <select id="filtroProfessorDiaTv">
                <option value="">Todos os dias</option>
                <option value="segunda">Segunda-feira</option>
                <option value="terca">Terca-feira</option>
                <option value="quarta">Quarta-feira</option>
                <option value="quinta">Quinta-feira</option>
                <option value="sexta">Sexta-feira</option>
            </select>

            <div class="acoes-filtro-professor">
                <button type="button" id="btnFiltrarProfessorTv">Filtrar</button>
                <button type="button" id="btnLimparFiltroProfessorTv">Limpar</button>
            </div>

            <div id="resultadoFiltroProfessorTv" class="resultado-filtro-professor">
                <p class="mensagem-tv">Digite seu nome para consultar suas aulas.</p>
            </div>
        </section>

        <section class="conteudo-tv-horarios">
            <div>
                <h2>Aulas em andamento</h2>
                <div id="listaAulasAgoraTv" class="grade-aulas-tv">
                    <p class="mensagem-tv">Carregando horarios...</p>
                </div>
            </div>

            <aside class="proximo-horario-tv">
                <h2>Proximos horarios</h2>
                <div id="proximoHorarioTv">
                    <p class="mensagem-tv">Consultando...</p>
                </div>
            </aside>
        </section>

        <footer class="rodape-tv-horarios">
            <span id="mensagemStatusTv">Conectando ao Supabase...</span>
            <span>Atualizado as <strong id="ultimaAtualizacaoTv">--:--</strong></span>
        </footer>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="horario-tv.js"></script>
</body>
</html>
